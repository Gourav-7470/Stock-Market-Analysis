version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: stock_analytics_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: stock_analytics_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/stock_analytics_db
      - JWT_SECRET=stock_analytics_super_secret_jwt_key_2026
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
      - ml-service
    restart: always

  ml-service:
    build: ./ml-service
    container_name: stock_analytics_ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  frontend:
    build: ./frontend
    container_name: stock_analytics_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
